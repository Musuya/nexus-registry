services:
  app:
    image: ghcr.io/musuya/nexus-registry/app:latest
    container_name: nexus_app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - nexus_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: nexus_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./resources/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - nexus_network
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    container_name: nexus_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_registry
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexus_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_user -d nexus_registry"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - nexus_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  horizon:
    image: ghcr.io/musuya/nexus-registry/app:latest
    container_name: nexus_horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - ./:/var/www/html
    networks:
      - nexus_network
    depends_on:
      - app
      - redis

  scheduler:
    image: ghcr.io/musuya/nexus-registry/app:latest
    container_name: nexus_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    networks:
      - nexus_network
    depends_on:
      - app

networks:
  nexus_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: